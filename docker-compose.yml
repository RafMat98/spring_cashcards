services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: cashcard-db
    environment:
      POSTGRES_DB: cashcarddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data # data persistence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cashcard-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cashcarddb # "postgres" = όνομα service
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080" # optional: for curl/Postman testing
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ── React Frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cashcard-frontend
    ports:
      - "443:443"
      - "80:80" # http://localhost:3000
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    restart: on-failure
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data: # named volume
