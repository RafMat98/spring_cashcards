# ── BOOTSTRAP 
server {
    listen 80;
    server_name spring.rmat.gr www.spring.rmat.gr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Bootstrap OK - waiting for SSL certificate';
        add_header Content-Type text/plain;
    }
}
